name: Build and deploy production image

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/niaalb/tnl-erp-custom

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tnl_theme
        uses: actions/checkout@v4

      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          push: true
          secret-files: |
            apps_json=deploy/apps.json
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build-and-push
    # Runs directly on the production server via a self-hosted runner instead
    # of GitHub connecting in over SSH: Hostinger's network-level firewall
    # silently drops inbound traffic from GitHub-hosted runners' IP ranges,
    # and there's no panel access to adjust that rule. A self-hosted runner
    # only makes outbound connections (to GitHub, to pull the image from
    # GHCR), which sidesteps the block entirely.
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          set -e
          cd /opt/frappe/frappe_docker
          sed -i "s/^CUSTOM_TAG=.*/CUSTOM_TAG=${{ github.sha }}/" custom.env
          docker compose --env-file custom.env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            -f overrides/compose.migrator.yaml \
            config > compose.custom.yaml
          docker compose -p frappe -f compose.custom.yaml pull
          docker compose -p frappe -f compose.custom.yaml up -d
