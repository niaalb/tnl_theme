name: Build and deploy production image

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/niaalb/tnl-erp-custom

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app_names: ${{ steps.app_names.outputs.list }}
    steps:
      - name: Checkout tnl_theme
        uses: actions/checkout@v4

      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      # deploy/apps.json controls what's *built into the image* — it was
      # already being read for that below. It does NOT install a newly
      # added app onto the actual production site; bench migrate (in
      # compose.migrator.yaml) only syncs apps a site already has
      # installed. This derives the site-install-app names from the same
      # file so the deploy job can also install anything new, instead of
      # that being a manual step every time an app is added here.
      - name: Derive installable app names from deploy/apps.json
        id: app_names
        run: |
          names=$(python3 -c "
          import json
          apps = json.load(open('deploy/apps.json'))
          names = [a['url'].rstrip('/').split('/')[-1].removesuffix('.git') for a in apps]
          print(' '.join(names))
          ")
          echo "list=$names" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          push: true
          secret-files: |
            apps_json=deploy/apps.json
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build-and-push
    # Runs directly on the production server via a self-hosted runner instead
    # of GitHub connecting in over SSH: Hostinger's network-level firewall
    # silently drops inbound traffic from GitHub-hosted runners' IP ranges,
    # and there's no panel access to adjust that rule. A self-hosted runner
    # only makes outbound connections (to GitHub, to pull the image from
    # GHCR), which sidesteps the block entirely.
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          set -e
          cd /opt/frappe/frappe_docker
          sed -i "s|^CUSTOM_IMAGE=.*|CUSTOM_IMAGE=${{ env.IMAGE }}|" custom.env
          sed -i "s/^CUSTOM_TAG=.*/CUSTOM_TAG=${{ github.sha }}/" custom.env
          # Turn the migrator container's own `bench migrate` off: it ran
          # in parallel with the explicit migrate step below, and with
          # `restart: on-failure:5` a failing run kept restarting and
          # re-taking the bench_migrate lock, so that step could never
          # get it. Migrating only in that step keeps it single and its
          # errors visible in this log.
          if grep -q '^MIGRATE_SITES=' custom.env; then
            sed -i 's/^MIGRATE_SITES=.*/MIGRATE_SITES=false/' custom.env
          else
            echo 'MIGRATE_SITES=false' >> custom.env
          fi
          docker compose --env-file custom.env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            -f overrides/compose.migrator.yaml \
            config > compose.custom.yaml
          # Must match the project name the existing production stack already
          # runs under (Compose defaults to the containing folder's name,
          # "frappe_docker", when no -p was given originally) — using a
          # different name here would spin up a second, parallel stack
          # instead of updating the real one, and both would fight over the
          # same bind-mounted database files.
          docker compose -p frappe_docker -f compose.custom.yaml pull
          docker compose -p frappe_docker -f compose.custom.yaml up -d

      - name: Wait for the migrator container to finish
        # `up -d` returns as soon as the migrator *starts*, and its
        # `bench --site all migrate` holds the bench_migrate file lock for
        # several minutes. The fixed 15s retries below were far shorter
        # than that, so every attempt hit "Failed to aquire lock:
        # bench_migrate" and the step still went green. Blocking on the
        # container's exit first means the steps below run against a
        # site that's no longer mid-migration.
        run: |
          cd /opt/frappe/frappe_docker
          migrator=$(docker compose -p frappe_docker -f compose.custom.yaml ps -aq migrator)
          if [ -n "$migrator" ]; then
            code=$(timeout 1800 docker wait "$migrator")
            echo "migrator exited with code $code"
            docker logs --tail 40 "$migrator"
          fi

      - name: Install any newly-added apps on the site
        # bench install-app is idempotent — an app already installed is
        # skipped with a warning, not an error — so this is safe to run
        # on every deploy, not just when an app is actually new. Retries
        # guard against the migrator container (started by the same
        # `up -d` above) still holding a DB lock from `bench migrate`
        # when this step starts.
        run: |
          cd /opt/frappe/frappe_docker
          for app in ${{ needs.build-and-push.outputs.app_names }}; do
            for attempt in 1 2 3 4 5; do
              if docker compose -p frappe_docker -f compose.custom.yaml exec -T backend \
                bench --site operiqsa.com install-app "$app"; then
                break
              fi
              echo "install-app $app failed (attempt $attempt/5), retrying in 15s..."
              sleep 15
            done
          done

      - name: Run site migrations unconditionally
        # The migrator container (compose.migrator.yaml) only runs bench
        # migrate when MIGRATE_SITES=true in custom.env — a reasonable
        # production safety default, but it means tnl_theme's own
        # after_migrate fixups (hide_frappe_help_links,
        # retire_legacy_crm_workspace, retire_legacy_crm_home_card — see
        # install.py) silently never ran if that's set to false or unset
        # here, regardless of whether that flag's intent was "skip
        # migrations" specifically or just never got set at all. Calling
        # migrate directly here every deploy, independent of that flag,
        # is what actually guarantees those fixups run. bench migrate
        # itself is idempotent (a no-op for anything already migrated),
        # so double-running it alongside the conditional migrator is safe.
        run: |
          cd /opt/frappe/frappe_docker
          for attempt in 1 2 3; do
            if docker compose -p frappe_docker -f compose.custom.yaml exec -T backend \
              bench --site operiqsa.com migrate; then
              exit 0
            fi
            echo "migrate failed (attempt $attempt/3), retrying in 15s..."
            sleep 15
          done
          # Fail the deploy loudly instead of reporting success when the
          # after_migrate fixups never actually ran.
          exit 1

      - name: Clear cache and report CRM tile state
        # Runs even if migrate failed, so the log always shows where the
        # home-screen "CRM" tile actually points — the server itself isn't
        # otherwise reachable for checking this by hand.
        if: always()
        run: |
          cd /opt/frappe/frappe_docker
          B="docker compose -p frappe_docker -f compose.custom.yaml exec -T backend bench --site operiqsa.com"
          $B clear-cache || true
          echo "--- Desktop Icon rows matching CRM ---"
          $B execute frappe.db.sql --args '["select name, label, icon_type, link_type, link, link_to, hidden, parent_icon, owner from `tabDesktop Icon` where label like \"%CRM%\""]' || true
          echo "--- Desktop Layouts mentioning CRM (fixed = already points at /crm) ---"
          $B execute frappe.db.sql --args '["select name, layout like \"%/crm%\" as fixed from `tabDesktop Layout` where layout like \"%CRM%\""]' || true

      - name: Clean up old images
        # Every deploy pulls a fresh multi-hundred-MB image; without this the
        # server's disk fills up within a handful of deploys (hit this
        # exact failure: "no space left on device" mid-extract). Only
        # removes images no longer referenced by any container, so the
        # image just deployed is untouched.
        run: docker image prune -af
