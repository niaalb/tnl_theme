name: Build and deploy production image

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/niaalb/tnl-erp-custom

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app_names: ${{ steps.app_names.outputs.list }}
    steps:
      - name: Checkout tnl_theme
        uses: actions/checkout@v4

      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      # deploy/apps.json controls what's *built into the image* — it was
      # already being read for that below. It does NOT install a newly
      # added app onto the actual production site; bench migrate (in
      # compose.migrator.yaml) only syncs apps a site already has
      # installed. This derives the site-install-app names from the same
      # file so the deploy job can also install anything new, instead of
      # that being a manual step every time an app is added here.
      - name: Derive installable app names from deploy/apps.json
        id: app_names
        run: |
          names=$(python3 -c "
          import json
          apps = json.load(open('deploy/apps.json'))
          names = [a['url'].rstrip('/').split('/')[-1].removesuffix('.git') for a in apps]
          print(' '.join(names))
          ")
          echo "list=$names" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          push: true
          secret-files: |
            apps_json=deploy/apps.json
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build-and-push
    # Runs directly on the production server via a self-hosted runner instead
    # of GitHub connecting in over SSH: Hostinger's network-level firewall
    # silently drops inbound traffic from GitHub-hosted runners' IP ranges,
    # and there's no panel access to adjust that rule. A self-hosted runner
    # only makes outbound connections (to GitHub, to pull the image from
    # GHCR), which sidesteps the block entirely.
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          set -e
          cd /opt/frappe/frappe_docker
          sed -i "s|^CUSTOM_IMAGE=.*|CUSTOM_IMAGE=${{ env.IMAGE }}|" custom.env
          sed -i "s/^CUSTOM_TAG=.*/CUSTOM_TAG=${{ github.sha }}/" custom.env
          docker compose --env-file custom.env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            -f overrides/compose.migrator.yaml \
            config > compose.custom.yaml
          # Must match the project name the existing production stack already
          # runs under (Compose defaults to the containing folder's name,
          # "frappe_docker", when no -p was given originally) — using a
          # different name here would spin up a second, parallel stack
          # instead of updating the real one, and both would fight over the
          # same bind-mounted database files.
          docker compose -p frappe_docker -f compose.custom.yaml pull
          docker compose -p frappe_docker -f compose.custom.yaml up -d

      - name: Install any newly-added apps on the site
        # bench install-app is idempotent — an app already installed is
        # skipped with a warning, not an error — so this is safe to run
        # on every deploy, not just when an app is actually new. Retries
        # guard against the migrator container (started by the same
        # `up -d` above) still holding a DB lock from `bench migrate`
        # when this step starts.
        run: |
          cd /opt/frappe/frappe_docker
          for app in ${{ needs.build-and-push.outputs.app_names }}; do
            for attempt in 1 2 3 4 5; do
              if docker compose -p frappe_docker -f compose.custom.yaml exec -T backend \
                bench --site operiqsa.com install-app "$app"; then
                break
              fi
              echo "install-app $app failed (attempt $attempt/5), retrying in 15s..."
              sleep 15
            done
          done

      - name: Clean up old images
        # Every deploy pulls a fresh multi-hundred-MB image; without this the
        # server's disk fills up within a handful of deploys (hit this
        # exact failure: "no space left on device" mid-extract). Only
        # removes images no longer referenced by any container, so the
        # image just deployed is untouched.
        run: docker image prune -af
